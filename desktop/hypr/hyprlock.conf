general {
    hide_cursor = true
}

animations {
    animation = inputFieldDots, 0, 1, default
}

background {
    monitor =
    path = /home/accelra/.local/share/wallpapers/cryoforge/current/lock.png
    color = rgba(05070dff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    zindex = -1
}

image {
    monitor =
    path = /home/accelra/.local/share/wallpapers/cryoforge/current/lock-overlay.png
    size = 1080
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

image {
    monitor =
    path = /home/accelra/.local/share/wallpapers/cryoforge/current/avatar.png
    size = 148
    rounding = 42
    border_size = 0
    position = 0, -42
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <span letter_spacing="3840">$TIME</span>
    color = rgba(55434dff)
    font_size = 99
    font_family = Bebas Neue
    position = 0, 162
    halign = center
    valign = center
    shadow_size = 3
    shadow_passes = 1
    shadow_color = rgba(ffffff7a)
    shadow_boost = 1.0
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] value=$(LC_ALL=C /run/current-system/sw/bin/date +"%A · %B %d" | /run/current-system/sw/bin/tr '[:lower:]' '[:upper:]'); printf '<span size="12.75pt" letter_spacing="2175">%s</span>' "$value"
    color = rgba(846e78ff)
    font_size = 13
    font_family = Zen Maru Gothic
    position = 0, 90
    halign = center
    valign = center
    shadow_size = 3
    shadow_passes = 1
    shadow_color = rgba(ffffff7a)
    shadow_boost = 1.0
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] if [ -r /sys/class/power_supply/BAT0/capacity ] && IFS= read -r value < /sys/class/power_supply/BAT0/capacity; then printf '<span size="13.5pt">%s%%</span>' "$value"; else printf '<span size="13.5pt">--</span>'; fi
    color = rgba(55434dff)
    font_size = 14
    font_family = Zen Maru Gothic
    position = 296, 181
    halign = center
    valign = center
    shadow_size = 3
    shadow_passes = 1
    shadow_color = rgba(ffffff7a)
    shadow_boost = 1.0
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] if [ -x /run/current-system/sw/bin/timeout ] && [ -x /run/current-system/sw/bin/nmcli ]; then state=$(/run/current-system/sw/bin/timeout 2 /run/current-system/sw/bin/nmcli -t -f STATE general status 2>/dev/null); else state=; fi; if [ "$state" = connected ]; then printf '<span size="12.75pt">ONLINE</span>'; else printf '<span size="12.75pt">OFFLINE</span>'; fi
    color = rgba(55434dff)
    font_size = 13
    font_family = Zen Maru Gothic
    position = 398, 185
    halign = center
    valign = center
    shadow_size = 3
    shadow_passes = 1
    shadow_color = rgba(ffffff7a)
    shadow_boost = 1.0
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] if [ -x /run/current-system/sw/bin/timeout ] && [ -x /run/current-system/sw/bin/nmcli ]; then state=$(/run/current-system/sw/bin/timeout 2 /run/current-system/sw/bin/nmcli -t -f STATE general status 2>/dev/null); else state=; fi; if [ "$state" = connected ]; then network=CONNECTED; else network=DISCONNECTED; fi; printf '<span size="9.75pt" letter_spacing="-96">%s</span>' "$network"
    color = rgba(846e78ff)
    font_size = 10
    font_family = Zen Maru Gothic
    position = -449, -76
    halign = right
    valign = center
    shadow_size = 3
    shadow_passes = 1
    shadow_color = rgba(ffffff7a)
    shadow_boost = 1.0
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] if [ -r /sys/class/power_supply/BAT0/capacity ] && IFS= read -r value < /sys/class/power_supply/BAT0/capacity; then printf '<span size="9.75pt">%s%%</span>' "$value"; else printf '<span size="9.75pt">--</span>'; fi
    color = rgba(846e78ff)
    font_size = 10
    font_family = Zen Maru Gothic
    position = -450, -141
    halign = right
    valign = center
    shadow_size = 3
    shadow_passes = 1
    shadow_color = rgba(ffffff7a)
    shadow_boost = 1.0
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] if [ -r /proc/uptime ] && IFS=' ' read -r seconds _ < /proc/uptime; then seconds=${seconds%.*}; days=$((seconds / 86400)); hours=$(((seconds % 86400) / 3600)); minutes=$(((seconds % 3600) / 60)); if [ "$days" -gt 0 ]; then value=$(printf '%02dD %02dH' "$days" "$hours"); else value=$(printf '%02dH %02dM' "$hours" "$minutes"); fi; else value=--; fi; printf '<span size="9.75pt" letter_spacing="-96">%s</span>' "$value"
    color = rgba(846e78ff)
    font_size = 10
    font_family = Zen Maru Gothic
    position = -449, -200
    halign = right
    valign = center
    shadow_size = 3
    shadow_passes = 1
    shadow_color = rgba(ffffff7a)
    shadow_boost = 1.0
    zindex = 2
}

input-field {
    monitor =
    size = 306, 20
    outline_thickness = 0
    dots_size = 0.80
    dots_spacing = 0.625
    dots_center = false
    dots_rounding = -1
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(55434dff)
    check_color = rgba(846e78ff)
    fail_color = rgba(c47f8dff)
    swap_font_color = true
    fade_on_empty = false
    hide_input = false
    rounding = 0
    font_family = Zen Maru Gothic
    placeholder_text = <span foreground="##826c76" size="9.25pt">ENTER PASSWORD</span>
    fail_text = <span foreground="##c47f8d" size="9.25pt">Try again</span>
    check_text =
    position = 32, -195
    halign = center
    valign = center
    shadow_passes = 0
    zindex = 3
}
