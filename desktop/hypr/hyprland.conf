# Caelestia-inspired Hyprland rice, adapted for accelra's NixOS host.

monitor = , preferred, auto, 1

$mainMod = SUPER
$terminal = kitty
$browser = firefox
$fileManager = thunar
$menu = rofi -show drun

env = NIXOS_OZONE_WL,1
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,gtk3
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice

exec-once = prepare-hyprland-session
exec-shutdown = systemctl --user stop hyprland-session.target
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

source = /etc/hypr/hyprexpo.conf

general {
    layout = dwindle
    gaps_in = 5
    gaps_out = 12
    gaps_workspaces = 20
    border_size = 2
    col.active_border = rgb(00e5ff)
    col.inactive_border = rgba(4d6fb799)
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 0.97
    inactive_opacity = 0.91
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 4
        color = rgba(0b0d1acc)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
    }
}

animations {
    enabled = true
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standard, 0.2, 0, 0, 1

    animation = windowsIn, 1, 5, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 3, emphasizedAccel, popin 80%
    animation = windowsMove, 1, 6, standard
    animation = workspaces, 1, 5, standard, slide
    animation = fade, 1, 6, standard
    animation = border, 1, 6, standard
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.4
    }
}

gesture = 3, horizontal, workspace

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(05070d)
}

plugin {
    hyprexpo {
        columns = 3
        gaps_in = 12
        gaps_out = 20
        bg_col = rgb(05070d)
        workspace_method = center current
        gesture_distance = 200
        cancel_key = escape
        show_cursor = 1
        show_pinned_windows = 0
    }
}

bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, code
bind = $mainMod, D, exec, $menu
bind = $mainMod, S, exec, systemd-run --user --scope --collect --quiet ~/.config/rofi/quick-settings.sh
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, G, hyprexpo:expo, toggle
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod SHIFT, E, exec, hyprctl dispatch exit
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p Clipboard | cliphist decode | wl-copy
bind = $mainMod SHIFT, C, exec, hyprpicker -a

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

windowrule = float on, match:class ^(pavucontrol|nwg-look|org.gnome.Calculator)$
windowrule = center on, match:class ^(pavucontrol|nwg-look|org.gnome.Calculator)$
windowrule = opacity 0.94 override 0.90 override, match:class ^(kitty)$
